<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBI変動率計算ツール - Pro Analysis</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0a0e1a; color: #e0e6f0; overflow-x: hidden; }
        .loading { color: #00e676; display: flex; justify-content: center; align-items: center; height: 100vh; font-size: 14px; letter-spacing: 2px; }
        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        /* 戻るリンクのスタイル */
        .back-link { 
            color: #445; 
            text-decoration: none; 
            font-size: 12px; 
            display: flex; 
            align-items: center; 
            transition: color 0.2s;
            margin-bottom: 8px;
        }
        .back-link:hover { color: #00e676; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        const TOTAL_NET_ASSETS = 185056568; // 2026/3/31 ファンド総額

        function App() {
            const [sbi, setSbi] = useState([]);
            const [summary, setSummary] = useState(null);
            const [loading, setLoading] = useState(true);
            const [activeTab, setActiveTab] = useState("calc");
            const [sectorFilter, setSectorFilter] = useState("全て");
            const [search, setSearch] = useState("");
            const [sortKey, setSortKey] = useState("ratio");
            const [sortOrder, setSortOrder] = useState("desc");

            useEffect(() => {
                async function init() {
                    try {
                        const cacheBuster = `?t=${Date.now()}`;
                        const [resS, resC, resSum] = await Promise.all([
                            fetch('./data/config.json'),
                            fetch(`./data/daily_changes.json${cacheBuster}`),
                            fetch(`./data/summary.json${cacheBuster}`)
                        ]);
                        
                        const allSbiRaw = await resS.json();
                        const latestChanges = await resC.json();
                        const summaryData = await resSum.json();

                        const unique = allSbiRaw.filter((s, i, arr) =>
                            s.evaluation > 0 && arr.findIndex(x => x.id === s.id) === i
                        );

                        const mapped = unique.map(s => ({
                            ...s,
                            ratio: (s.evaluation / TOTAL_NET_ASSETS) * 100,
                            daily_change: (typeof latestChanges[s.code] === 'number') ? latestChanges[s.code].toString() : ""
                        }));
