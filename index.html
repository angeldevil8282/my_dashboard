<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBI変動率計算ツール - Pro v2</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0a0e1a; color: #e0e6f0; overflow-x: hidden; }
        .loading { color: #00e676; display: flex; justify-content: center; align-items: center; height: 100vh; font-size: 14px; letter-spacing: 2px; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .active-tab { border-bottom: 2px solid #00e676 !important; color: #00e676 !important; background: rgba(0, 230, 118, 0.05); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        const TOTAL_NET_ASSETS = 123100000000; // 1,231億円（画像に合わせ調整）

        function App() {
            const [stocks, setStocks] = useState([]);
            const [loading, setLoading] = useState(true);
            const [activeTab, setActiveTab] = useState("calc"); // "calc" or "result"
            const [sectorFilter, setSectorFilter] = useState("全て");
            const [search, setSearch] = useState("");
            const [sortKey, setSortKey] = useState("ratio");
            const [sortOrder, setSortOrder] = useState("desc");

            useEffect(() => {
                async function init() {
                    try {
                        const [resS, resC] = await Promise.all([
                            fetch('./stocks.json'),
                            fetch(`./daily_changes.json?t=${Date.now()}`)
                        ]);
                        const allStocksRaw = await resS.json();
                        const latestChanges = await resC.json();
                        const unique = allStocksRaw.filter((s, i, arr) => s.evaluation > 0 && arr.findIndex(x => x.id === s.id) === i);
                        const mapped = unique.map(s => ({
                            ...s,
                            daily_change: (typeof latestChanges[s.code] === 'number') ? latestChanges[s.code].toString() : ""
                        }));
                        setStocks(mapped);
                        setLoading(false);
                    } catch (e) { console.error(e); }
                }
                init();
            }, []);

            const stocksWithRatio = useMemo(() => stocks.map(s => ({ ...s, ratio: (s.evaluation / TOTAL_NET_ASSETS) * 100 })), [stocks]);
            const inputCount = stocks.filter(s => s.daily_change !== "").length;
            const coverageRatio = stocksWithRatio.filter(s => s.daily_change !== "").reduce((sum, s) => sum + s.ratio, 0);

            const sigmaRaw = useMemo(() => {
                return stocksWithRatio.reduce((sum, s) => {
                    const change = parseFloat(s.daily_change);
                    return isNaN(change) ? sum : sum + (s.ratio * change) / 100;
                }, 0);
            }, [stocksWithRatio]);

            const sigmaAdjusted = sigmaRaw * 0.9 - 0.05;

            const handleSort = (key) => {
                if (sortKey === key) setSortOrder(prev => prev === "asc" ? "desc" : "asc");
                else { setSortKey(key); setSortOrder("desc"); }
            };

            const filteredStocks = useMemo(() => {
                const base = stocksWithRatio.filter(s => (sectorFilter === "全て" || s.sector === sectorFilter) && (!search || s.name.includes(search) || s.code.includes(search)));
                return [...base].sort((a, b) => {
                    let valA, valB;
                    if (sortKey === "ratio") [valA, valB] = [a.ratio, b.ratio];
                    else if (sortKey === "change") [valA, valB] = [parseFloat(a.daily_change) || -999, parseFloat(b.daily_change) || -999];
                    else [valA, valB] = [(a.ratio * (parseFloat(a.daily_change) || 0)), (b.ratio * (parseFloat(b.daily_change) || 0))];
                    return sortOrder === "asc" ? valA - valB : valB - valA;
                });
            }, [stocksWithRatio, sectorFilter, search, sortKey, sortOrder]);

            if (loading) return <div className="loading">SYSTEM INITIALIZING...</div>;

            return (
                <div style={S.root}>
                    <div style={S.bgGrid} />
                    
                    {/* Header Section */}
                    <header style={S.header}>
                        <div style={S.headerInner}>
                            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                                <div style={S.logoIcon}>📊</div>
                                <div>
                                    <div style={S.logoTitle}>SBI変動率計算ツール</div>
                                    <div style={S.logoSub}>全{stocks.length}銘柄対応版 · 純資産1,231億円</div>
                                </div>
                            </div>
                            <div style={{ display: "flex", gap: 6 }}>
                                <StatCard label="入力済" val={`${inputCount}/${stocks.length}`} color="#00e676" />
                                <StatCard label="カバー" val={`${coverageRatio.toFixed(1)}%`} color="#00e676" />
                                <StatCard label="予測" val={`${sigmaAdjusted > 0 ? "+" : ""}${sigmaAdjusted.toFixed(3)}%`} color={sigmaAdjusted > 0 ? "#00e676" : "#ff5252"} />
                            </div>
                        </div>
                    </header>

                    <div style={S.container}>
                        {/* Tab Navigation */}
                        <div style={S.tabs}>
                            <div onClick={() => setActiveTab("calc")} style={{ ...S.tab, ...(activeTab === "calc" ? S.activeTab : {}) }}>📋 銘柄入力</div>
                            <div onClick={() => setActiveTab("result")} style={{ ...S.tab, ...(activeTab === "result" ? S.activeTab : {}) }}>📈 結果・検証</div>
                        </div>

                        {activeTab === "calc" ? (
                            <>
                                {/* Main Prediction Card */}
                                <div style={S.predictionCard}>
                                    <div style={S.predGrid}>
                                        <div style={S.predItem}>
                                            <div style={S.predLabel}>生のΣ</div>
                                            <div style={{ ...S.predVal, color: sigmaRaw >= 0 ? "#00e676" : "#ff5252" }}>{sigmaRaw.toFixed(3)}%</div>
                                        </div>
                                        <div style={S.formula}>×0.9 － 0.05</div>
                                        <div style={S.predItem}>
                                            <div style={S.predLabel}>改良式（予測）</div>
                                            <div style={{ ...S.predVal, fontSize: 28, color: sigmaAdjusted >= 0 ? "#00e676" : "#ff5252" }}>{sigmaAdjusted.toFixed(3)}%</div>
                                        </div>
                                    </div>
                                </div>

                                {/* Filter Controls */}
                                <div style={S.controls}>
                                    <input value={search} onChange={e => setSearch(e.target.value)} placeholder="銘柄名・コード検索..." style={S.searchInput} />
                                    <select value={sectorFilter} onChange={e => setSectorFilter(e.target.value)} style={S.select}>
                                        <option value="全て">全て</option>
                                        {Array.from(new Set(stocks.map(s => s.sector))).map(s => <option key={s} value={s}>{s}</option>)}
                                    </select>
                                </div>

                                {/* Stock Table */}
                                <div style={S.tableWrap}>
                                    <div style={S.tableHeader}>
                                        <span style={{ flex: 1 }}>コード / 銘柄</span>
                                        <SortCol label="比率" active={sortKey === "ratio"} order={sortOrder} onClick={() => handleSort("ratio")} width={60} />
                                        <SortCol label="前日比" active={sortKey === "change"} order={sortOrder} onClick={() => handleSort("change")} width={80} />
                                        <SortCol label="寄与" active={sortKey === "contribution"} order={sortOrder} onClick={() => handleSort("contribution")} width={70} />
                                    </div>
                                    {filteredStocks.map(s => (
                                        <div key={s.id} style={S.tableRow}>
                                            <div style={{ flex: 1, minWidth: 0 }}>
                                                <div style={S.stockCode}>{s.code}</div>
                                                <div style={S.stockName}>{s.name}</div>
                                            </div>
                                            <span style={S.cellRatio}>{s.ratio.toFixed(2)}%</span>
                                            <div style={{ width: 80 }}>
                                                <input type="number" step="0.01" value={s.daily_change} 
                                                    onChange={e => setStocks(prev => prev.map(item => item.id === s.id ? { ...item, daily_change: e.target.value } : item))}
                                                    style={{ ...S.cellInput, color: (parseFloat(s.daily_change) > 0 ? "#00e676" : parseFloat(s.daily_change) < 0 ? "#ff5252" : "#889") }} placeholder="0.00" />
                                            </div>
                                            <span style={{ ...S.cellContrib, color: (s.ratio * parseFloat(s.daily_change) > 0 ? "#00e676" : "#ff5252") }}>
                                                {(s.ratio * (parseFloat(s.daily_change) || 0) / 100).toFixed(3)}
                                            </span>
                                        </div>
                                    ))}
                                </div>
                            </>
                        ) : (
                            <div style={S.emptyState}>
                                <h3>検証データ</h3>
                                <p style={{ color: "#445" }}>前日比データの詳細解析・ヒストリカルデータとの比較画面（準備中）</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // Sub-components
        const StatCard = ({ label, val, color }) => (
            <div style={S.statCard}>
                <div style={S.statLabel}>{label}</div>
                <div style={{ ...S.statVal, color }}>{val}</div>
            </div>
        );

        const SortCol = ({ label, active, order, onClick, width }) => (
            <div onClick={onClick} style={{ width, textAlign: "right", cursor: "pointer", userSelect: "none" }}>
                <span style={{ color: active ? "#00e676" : "#445", fontSize: 11, fontWeight: active ? "bold" : "normal" }}>
                    {label} {active ? (order === "asc" ? "▲" : "▼") : ""}
                </span>
            </div>
        );

        const S = {
            root: { minHeight: "100vh", paddingBottom: 40 },
            bgGrid: { position: "fixed", inset: 0, backgroundImage: "linear-gradient(rgba(0,230,118,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,230,118,0.03) 1px,transparent 1px)", backgroundSize: "30px 30px", pointerEvents: "none", zIndex: -1 },
            header: { position: "sticky", top: 0, zIndex: 100, background: "rgba(10,14,26,0.9)", borderBottom: "1px solid #1a2a1a", backdropFilter: "blur(12px)" },
            headerInner: { maxWidth: 800, margin: "0 auto", padding: "12px 16px", display: "flex", justifyContent: "space-between", alignItems: "center" },
            logoIcon: { fontSize: 24, background: "#1a2a1a", padding: 8, borderRadius: 8 },
            logoTitle: { fontSize: 16, fontWeight: 800, color: "#00e676", letterSpacing: "0.5px" },
            logoSub: { fontSize: 10, color: "#4e5a65" },
            statCard: { background: "rgba(20,30,40,0.6)", border: "1px solid #1a2a1a", borderRadius: 8, padding: "4px 10px", minWidth: 60, textAlign: "center" },
            statLabel: { fontSize: 9, color: "#4e5a65", marginBottom: 2 },
            statVal: { fontSize: 13, fontWeight: 700 },
            container: { maxWidth: 800, margin: "0 auto", padding: "16px" },
            tabs: { display: "flex", gap: 4, marginBottom: 16, borderBottom: "1px solid #1a2a1a" },
            tab: { flex: 1, padding: "12px", textAlign: "center", cursor: "pointer", fontSize: 13, color: "#4e5a65", fontWeight: 600, transition: "0.2s" },
            activeTab: { borderBottom: "2px solid #00e676", color: "#00e676", background: "rgba(0,230,118,0.05)" },
            predictionCard: { background: "linear-gradient(145deg, #0d1520, #080c14)", border: "1px solid #1a2a1a", borderRadius: 12, padding: "20px", marginBottom: 20 },
            predGrid: { display: "flex", alignItems: "center", justifyContent: "space-around", textAlign: "center" },
            predItem: { flex: 1 },
            predLabel: { fontSize: 11, color: "#4e5a65", marginBottom: 8 },
            predVal: { fontSize: 20, fontWeight: 800, fontFamily: "monospace" },
            formula: { color: "#1a2a1a", fontSize: 18, fontWeight: 700, margin: "0 10px" },
            controls: { display: "flex", gap: 8, marginBottom: 12 },
            searchInput: { flex: 1, background: "#0d1520", border: "1px solid #1a2a1a", borderRadius: 6, color: "#fff", padding: "10px", fontSize: 13 },
            select: { background: "#0d1520", border: "1px solid #1a2a1a", borderRadius: 6, color: "#889", padding: "10px" },
            tableWrap: { background: "#0d1520", border: "1px solid #1a2a1a", borderRadius: 10, overflow: "hidden" },
            tableHeader: { display: "flex", padding: "12px 16px", background: "#060d18", borderBottom: "1px solid #1a2a1a", fontSize: 11, color: "#445" },
            tableRow: { display: "flex", alignItems: "center", padding: "10px 16px", borderBottom: "1px solid #16202a", gap: 10 },
            stockCode: { fontSize: 10, color: "#334" },
            stockName: { fontSize: 12, color: "#aabbc0", fontWeight: 500, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" },
            cellRatio: { width: 60, textAlign: "right", fontSize: 11, color: "#4e5a65" },
            cellInput: { background: "transparent", border: "1px solid #1a2a2e", borderRadius: 4, padding: "6px", textAlign: "right", width: "100%", fontSize: 13, outline: "none" },
            cellContrib: { width: 70, textAlign: "right", fontSize: 12, fontWeight: 700, fontFamily: "monospace" },
            emptyState: { textAlign: "center", padding: "40px", background: "#0d1520", borderRadius: 12, border: "1px dashed #1a2a1a" }
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
