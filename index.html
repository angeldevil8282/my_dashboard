<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBI変動率計算ツール - Pro</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0a0e1a; overflow-x: hidden; }
        .loading { color: #00e676; display: flex; justify-content: center; align-items: center; height: 100vh; font-size: 14px; letter-spacing: 2px; }
        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        const TOTAL_NET_ASSETS = 114987493;

        function App() {
            const [stocks, setStocks] = useState([]);
            const [loading, setLoading] = useState(true);
            const [activeTab, setActiveTab] = useState("calc");
            const [sectorFilter, setSectorFilter] = useState("全て");
            const [search, setSearch] = useState("");
            
            // ソート状態管理
            const [sortKey, setSortKey] = useState("ratio"); // ratio, change, contrib
            const [sortOrder, setSortOrder] = useState("desc");

            useEffect(() => {
                async function init() {
                    try {
                        const [resS, resC] = await Promise.all([
                            fetch('./stocks.json'),
                            fetch(`./daily_changes.json?t=${Date.now()}`)
                        ]);
                        const allStocksRaw = await resS.json();
                        const latestChanges = await resC.json();

                        const unique = allStocksRaw.filter((s, i, arr) =>
                            s.evaluation > 0 && arr.findIndex(x => x.id === s.id) === i
                        );

                        const mapped = unique.map(s => ({
                            ...s,
                            daily_change: (typeof latestChanges[s.code] === 'number') ? latestChanges[s.code].toString() : ""
                        }));

                        setStocks(mapped);
                        setLoading(false);
                    } catch (e) {
                        console.error("Data Load Error:", e);
                    }
                }
                init();
            }, []);

            const sectors = useMemo(() => ["全て", ...Array.from(new Set(stocks.map(s => s.sector)))], [stocks]);

            // 基本計算データ作成
            const processedStocks = useMemo(() => {
                return stocks.map(s => {
                    const ratio = (s.evaluation / TOTAL_NET_ASSETS) * 100;
                    const change = parseFloat(s.daily_change);
                    const contrib = isNaN(change) ? 0 : (ratio * change) / 100;
                    return { ...s, ratio, contrib, changeNum: isNaN(change) ? -999 : change };
                });
            }, [stocks]);

            const sigmaRaw = useMemo(() => processedStocks.reduce((sum, s) => sum + s.contrib, 0), [processedStocks]);
            const sigmaAdjusted = sigmaRaw * 0.9 - 0.05;
            const coverageRatio = processedStocks.filter(s => s.daily_change !== "").reduce((sum, s) => sum + s.ratio, 0);

            // ソート・フィルタリング
            const filteredStocks = useMemo(() => {
                let base = processedStocks.filter(s => {
                    const matchSector = sectorFilter === "全て" || s.sector === sectorFilter;
                    const matchSearch = !search || s.name.includes(search) || s.code.includes(search);
                    return matchSector && matchSearch;
                });

                return base.sort((a, b) => {
                    let valA, valB;
                    if (sortKey === "ratio") { [valA, valB] = [a.ratio, b.ratio]; }
                    else if (sortKey === "change") { [valA, valB] = [a.changeNum, b.changeNum]; }
                    else { [valA, valB] = [a.contrib, b.contrib]; }
                    return sortOrder === "asc" ? valA - valB : valB - valA;
                });
            }, [processedStocks, sectorFilter, search, sortKey, sortOrder]);

            const toggleSort = (key) => {
                if (sortKey === key) {
                    setSortOrder(sortOrder === "desc" ? "asc" : "desc");
                } else {
                    setSortKey(key);
                    setSortOrder("desc");
                }
            };

            const getColor = val => {
                const n = parseFloat(val);
                if (isNaN(n) || n === 0) return "#556";
                return n > 0 ? "#00e676" : "#ff5252";
            };

            const fmt = (val, d = 3) => `${val > 0 ? "+" : ""}${val.toFixed(d)}%`;

            if (loading) return <div className="loading">SYSTEM INITIALIZING...</div>;

            return (
                <div style={S.root}>
                    <div style={S.bgGrid} />
                    <header style={S.header}>
                        <div style={S.headerInner}>
                            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                                <span style={{ fontSize: 22 }}>📊</span>
                                <div>
                                    <div style={S.logoTitle}>SBI変動率計算ツール</div>
                                    <div style={S.logoSub}>全{stocks.length}銘柄対応 / 精度向上版</div>
                                </div>
                            </div>
                            <div style={{ display: "flex", gap: 8 }}>
                                <Chip label="カバー" val={`${coverageRatio.toFixed(1)}%`} />
                                <Chip label="予測" val={fmt(sigmaAdjusted)} color={getColor(sigmaAdjusted)} />
                            </div>
                        </div>
                    </header>

                    <div style={S.tabBar}>
                        {[{ key: "calc", label: "📋 銘柄入力" }, { key: "result", label: "📈 分析結果" }].map(t => (
                            <button key={t.key} onClick={() => setActiveTab(t.key)}
                                style={{ ...S.tab, ...(activeTab === t.key ? S.tabActive : {}) }}>
                                {t.label}
                            </button>
                        ))}
                    </div>

                    <div style={S.content}>
                        {activeTab === "calc" && (
                            <>
                                <div style={S.previewCard}>
                                    <div style={S.previewLabel}>改良式によるSBI予測変動率</div>
                                    <div style={{ fontSize: 42, fontWeight: 800, color: getColor(sigmaAdjusted), textAlign: "center", letterSpacing: -1 }}>
                                        {fmt(sigmaAdjusted)}
                                    </div>
                                    <div style={{ fontSize: 10, color: "#445", textAlign: "center", marginTop: 8 }}>
                                        内部計算: Σ({sigmaRaw.toFixed(4)}%) × 0.9 - 0.05
                                    </div>
                                </div>

                                <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
                                    <input value={search} onChange={e => setSearch(e.target.value)}
                                        placeholder="銘柄名・コードで検索..." style={S.searchInput} />
                                    <select value={sectorFilter} onChange={e => setSectorFilter(e.target.value)} style={S.select}>
                                        {sectors.map(s => <option key={s} value={s}>{s}</option>)}
                                    </select>
                                </div>

                                {/* テーブルヘッダー */}
                                <div style={S.tableHeader}>
                                    <div style={{ flex: 1, color: "#445", fontSize: 10 }}>銘柄情報</div>
                                    <div onClick={() => toggleSort("ratio")} style={{...S.sortBtn, color: sortKey === "ratio" ? "#00e676" : "#445"}}>
                                        比率 {sortKey === "ratio" && (sortOrder === "desc" ? "▼" : "▲")}
                                    </div>
                                    <div onClick={() => toggleSort("change")} style={{...S.sortBtn, color: sortKey === "change" ? "#00e676" : "#445"}}>
                                        前日比 {sortKey === "change" && (sortOrder === "desc" ? "▼" : "▲")}
                                    </div>
                                    <div onClick={() => toggleSort("contrib")} style={{...S.sortBtn, color: sortKey === "contrib" ? "#00e676" : "#445", width: 60}}>
                                        寄与 {sortKey === "contrib" && (sortOrder === "desc" ? "▼" : "▲")}
                                    </div>
                                </div>

                                <div style={S.tableWrap}>
                                    {filteredStocks.map(s => (
                                        <div key={s.id} style={S.tableRow}>
                                            <div style={{ flex: 1, minWidth: 0 }}>
                                                <div style={{ fontSize: 9, color: "#445", fontWeight: 600 }}>{s.code}</div>
                                                <div style={{ fontSize: 11, color: "#aabbc0", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{s.name}</div>
                                            </div>
                                            <div style={{ width: 45, textAlign: "right", fontSize: 11, color: "#667" }}>
                                                {s.ratio.toFixed(1)}%
                                            </div>
                                            <div style={{ width: 75, display: "flex", justifyContent: "flex-end" }}>
                                                <input type="number" step="0.01" value={s.daily_change} 
                                                    onChange={e => setStocks(prev => prev.map(item => item.id === s.id ? { ...item, daily_change: e.target.value } : item))}
                                                    style={{ ...S.input, color: getColor(s.daily_change) }} />
                                            </div>
                                            <div style={{ width: 60, textAlign: "right", fontSize: 11, fontWeight: 700, color: getColor(s.contrib) }}>
                                                {s.contrib === 0 ? "0.00" : (s.contrib > 0 ? "+" : "") + s.contrib.toFixed(3)}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </>
                        )}

                        {activeTab === "result" && (
                            <>
                                {/* ここが復活したセクション：個別寄与度 */}
                                <div style={S.card}>
                                    <div style={S.cardTitle}>寄与度 TOP10 (銘柄別)</div>
                                    {topContribs.map((s, i) => (
                                        <div key={s.id} style={S.rankRow}>
                                            <span style={{ fontSize: 11, color: "#889", width: 110, overflow: "hidden", whiteSpace: "nowrap" }}>{s.name}</span>
                                            <div style={S.barContainer}>
                                                <div style={{ ...S.bar, width: `${Math.min(Math.abs(s.contribution) * 600, 100)}%`, background: s.contribution > 0 ? "#00e676" : "#ff5252" }} />
                                            </div>
                                            <span style={{ fontSize: 12, color: getColor(s.contribution), width: 70, textAlign: "right" }}>{fmt(s.contribution, 4)}</span>
                                        </div>
                                    ))}
                                </div>

                                {/* ここが復活したセクション：業種別セクター寄与 */}
                                <div style={S.card}>
                                    <div style={S.cardTitle}>業種別セクター寄与</div>
                                    {sectorContribs.map((sector, i) => (
                                        <div key={i} style={S.rankRow}>
                                            <span style={{ fontSize: 11, color: "#889", width: 90 }}>{sector.name}</span>
                                            <div style={S.barContainerCenter}>
                                                <div style={S.barCenterLine} />
                                                <div style={{
                                                    ...S.barCenter,
                                                    left: sector.val > 0 ? "50%" : `calc(50% - ${Math.min(Math.abs(sector.val) * 400, 50)}%)`,
                                                    width: `${Math.min(Math.abs(sector.val) * 400, 50)}%`,
                                                    background: sector.val > 0 ? "linear-gradient(90deg,#00e676,#00b248)" : "linear-gradient(90deg,#c50000,#ff5252)"
                                                }} />
                                            </div>
                                            <span style={{ fontSize: 12, color: getColor(sector.val), width: 72, textAlign: "right" }}>{fmt(sector.val, 4)}</span>
                                        </div>
                                    ))}
                                </div>
                            </>
                        )}
                    </div>
                </div>
            );
        }

        const S = {
            root: { minHeight: "100vh", background: "#0a0e1a", color: "#e0e6f0", paddingBottom: 40 },
            bgGrid: { position: "fixed", inset: 0, backgroundImage: "linear-gradient(rgba(0,230,118,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,230,118,0.02) 1px,transparent 1px)", backgroundSize: "40px 40px", pointerEvents: "none" },
            header: { position: "sticky", top: 0, zIndex: 100, background: "rgba(10,14,26,0.95)", borderBottom: "1px solid #1e3a2e", backdropFilter: "blur(8px)" },
            headerInner: { maxWidth: 720, margin: "0 auto", padding: "10px 16px", display: "flex", justifyContent: "space-between", alignItems: "center" },
            logoTitle: { fontSize: 14, fontWeight: 700, color: "#00e676" },
            logoSub: { fontSize: 9, color: "#445" },
            tabBar: { maxWidth: 720, margin: "0 auto", display: "flex", padding: "12px 16px 0", gap: 4 },
            tab: { flex: 1, padding: "12px", background: "rgba(255,255,255,0.02)", border: "1px solid #1a2a1a", borderBottom: "none", color: "#445", borderRadius: "8px 8px 0 0", cursor: "pointer", fontSize: 12, transition: "0.2s" },
            tabActive: { background: "#0d1520", border: "1px solid #1e3a2e", color: "#00e676", fontWeight: 700 },
            content: { maxWidth: 720, margin: "0 auto", padding: "16px", background: "#0d1520", border: "1px solid #1e3a2e", borderRadius: "0 0 12px 12px", minHeight: "60vh" },
            previewCard: { background: "#060d18", border: "1px solid #1e3a2e", borderRadius: 12, padding: "24px", marginBottom: 20, boxShadow: "0 10px 30px rgba(0,0,0,0.5)" },
            previewLabel: { fontSize: 10, color: "#00e676", textAlign: "center", marginBottom: 4, letterSpacing: 1, fontWeight: 600 },
            searchInput: { flex: 1, background: "#0a1520", border: "1px solid #222", borderRadius: 8, color: "#fff", padding: "10px 12px", fontSize: 13, outline: "none" },
            select: { background: "#0a1520", border: "1px solid #222", borderRadius: 8, color: "#889", padding: "10px", fontSize: 12 },
            tableHeader: { display: "flex", alignItems: "center", padding: "0 12px 10px", gap: 8, borderBottom: "1px solid #1a2a1a" },
            sortBtn: { fontSize: 10, cursor: "pointer", userSelect: "none", textAlign: "right", width: 50, fontWeight: 600 },
            tableWrap: { borderRadius: 8, overflow: "hidden" },
            tableRow: { display: "flex", alignItems: "center", padding: "10px 12px", borderBottom: "1px solid #0d1a0d", gap: 8, transition: "background 0.2s" },
            input: { background: "#060d18", border: "1px solid #222", borderRadius: 6, padding: "6px", textAlign: "right", outline: "none", width: "100%", fontSize: 13, fontWeight: 700 },
            card: { background: "#060d18", border: "1px solid #1a2a1a", borderRadius: 10, padding: "20px" },
            cardTitle: { fontSize: 11, color: "#00e676", marginBottom: 16, fontWeight: 700 },
            rankRow: { display: "flex", alignItems: "center", gap: 10, padding: "8px 0", borderBottom: "1px solid #0d1a0d" },
            barContainer: { flex: 1, height: 4, background: "#111", borderRadius: 2, overflow: "hidden" },
            bar: { height: "100%", borderRadius: 2, transition: "width 0.6s cubic-bezier(0.16, 1, 0.3, 1)" }
        };

        function Chip({ label, val, color = "#00e676" }) {
            return (
                <div style={{ background: "#060d18", border: "1px solid #1e3a2e", borderRadius: 8, padding: "6px 12px", textAlign: "center", minWidth: 70 }}>
                    <div style={{ fontSize: 8, color: "#445", marginBottom: 2, fontWeight: 600 }}>{label}</div>
                    <div style={{ fontSize: 12, color, fontWeight: 800 }}>{val}</div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
