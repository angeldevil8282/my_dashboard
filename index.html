<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBI高配当変動率ダッシュボード</title>
    <!-- React & Babel (CDN経由でビルド不要に) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin:0; background:#0a0e1a;">
    <div id="root"></div>

    <script type="text/babel">
        // ここにあなたのReactコードを貼り付けます
        // (以下の fetch 部分だけ、相対パスに変更してあります)
        const { useState, useMemo, useEffect } = React;

        function App() {
            // ... (ここに提示されたロジックをそのままコピー) ...
            // ただし、データ取得元を自分のサイト内に向ける
            useEffect(() => {
                async function loadData() {
                    // 同一リポジトリ内のファイルを読み込む
                    const [stocksRes, changesRes] = await Promise.all([
                        fetch('./stocks.json'), 
                        fetch(`./daily_changes.json?t=${Date.now()}`)
                    ]);
                    const stocksData = await stocksRes.json();
                    const changesData = await changesRes.json();
                    
                    // 以下、銘柄データと変動率をマッピングするロジック
                }
                loadData();
            }, []);
            
            return (
                /* ここにあなたのJSXスタイルを適用 */
                <div>...</div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
