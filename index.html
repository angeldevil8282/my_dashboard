<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SBI変動率計算ツール</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #0a0e1a;
    color: #e0e6f0;
    font-family: 'DM Mono', 'Courier New', monospace;
    position: relative;
  }
  .bg-grid {
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(0,230,118,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,230,118,0.025) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none; z-index: 0;
  }
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(10,14,26,0.97);
    border-bottom: 1px solid #1a2a1a;
  }
  .header-inner {
    max-width: 720px; margin: 0 auto;
    padding: 10px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .logo-area { display: flex; align-items: center; gap: 10px; }
  .logo-title { font-size: 14px; font-weight: 700; color: #00e676; letter-spacing: 1px; }
  .logo-sub { font-size: 9px; color: #334; }
  .chips { display: flex; gap: 8px; }
  .chip {
    background: #111820; border: 1px solid #1e3a2e; border-radius: 6px;
    padding: 4px 10px; display: flex; flex-direction: column; align-items: center;
  }
  .chip-label { font-size: 9px; color: #556; letter-spacing: 1px; }
  .chip-val { font-size: 12px; font-weight: 700; color: #00e676; }
  .tab-bar {
    max-width: 720px; margin: 0 auto;
    display: flex; padding: 8px 16px 0; gap: 4px;
    position: relative; z-index: 10;
  }
  .tab {
    flex: 1; padding: 9px 0;
    background: transparent;
    border: 1px solid #1a2a1a; border-bottom: none;
    color: #445; cursor: pointer; font-size: 12px;
    border-radius: 6px 6px 0 0;
    font-family: inherit;
    transition: all 0.2s;
  }
  .tab.active {
    background: #0d1520;
    border-color: #1e3a2e; border-bottom: 1px solid #0d1520;
    color: #00e676;
  }
  .content {
    max-width: 720px; margin: 0 auto;
    padding: 0 16px 40px;
    position: relative; z-index: 10;
    background: #0d1520;
    border-left: 1px solid #1e3a2e;
    border-right: 1px solid #1e3a2e;
    border-bottom: 1px solid #1e3a2e;
    border-radius: 0 0 8px 8px;
  }
  .preview-card {
    background: #060d18; border: 1px solid #1e3a2e;
    border-radius: 10px; padding: 14px 20px; margin: 14px 0;
  }
  .preview-row { display: flex; align-items: center; justify-content: center; gap: 24px; }
  .preview-item { text-align: center; }
  .preview-label { font-size: 9px; color: #445; letter-spacing: 1px; margin-bottom: 4px; }
  .preview-arrow { color: #1e3a2e; font-size: 16px; }
  .filter-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .search-input {
    flex: 1; background: #0a1520; border: 1px solid #222;
    border-radius: 6px; color: #e0e6f0;
    padding: 7px 12px; font-size: 12px; outline: none;
    font-family: inherit;
  }
  select {
    background: #0a1520; border: 1px solid #222;
    border-radius: 6px; color: #889;
    padding: 7px 8px; font-size: 11px; outline: none;
    font-family: inherit;
  }
  .table-wrap { border: 1px solid #1a2a1a; border-radius: 8px; overflow: hidden; margin-bottom: 12px; }
  .table-header {
    display: flex; align-items: center;
    padding: 7px 12px; background: #060d18;
    font-size: 9px; color: #334; letter-spacing: 1px;
    border-bottom: 1px solid #1a2a1a; gap: 8px;
  }
  .table-header span { cursor: pointer; }
  .table-body { max-height: 60vh; overflow-y: auto; }
  .table-row {
    display: flex; align-items: center;
    padding: 6px 12px; border-bottom: 1px solid #0d1a0d;
    gap: 8px;
  }
  .stock-code { font-size: 9px; color: #445; }
  .stock-name { font-size: 11px; color: #aabbc0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stock-sector { font-size: 9px; color: #334; }
  input[type=number] {
    background: #0a1520; border: 1px solid #222;
    border-radius: 4px; color: #e0e6f0;
    padding: 4px 6px; font-size: 12px;
    text-align: right; outline: none;
    font-family: inherit; width: 100%;
    box-sizing: border-box;
    -moz-appearance: textfield;
  }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
  .clear-btn {
    width: 100%; padding: 10px;
    background: transparent; border: 1px solid #1a2a1a;
    border-radius: 6px; color: #445; cursor: pointer;
    font-size: 12px; font-family: inherit;
  }
  .card { background: #060d18; border: 1px solid #1a2a1a; border-radius: 8px; padding: 14px 16px; margin-bottom: 12px; }
  .card-title { font-size: 9px; color: #00e676; letter-spacing: 2px; margin-bottom: 10px; text-transform: uppercase; }
  .card-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid #0d1a0d; }
  .rank-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid #0d1a0d; }
  .rank-bar { flex: 1; height: 4px; background: #111; border-radius: 2px; overflow: hidden; }
  .rank-bar-fill { height: 100%; border-radius: 2px; transition: width 0.4s; }
  .save-log-btn {
    width: 100%; padding: 12px; margin-top: 10px;
    background: #1e3a2e; border: 1px solid #00e676;
    border-radius: 6px; color: #00e676;
    font-weight: 700; cursor: pointer; font-family: inherit;
    font-size: 13px;
  }
  #tab-calc { display: block; }
  #tab-result { display: none; }
  .hidden { display: none !important; }
  .pos { color: #00e676; }
  .neg { color: #ff5252; }
  .neu { color: #556; }
  .sector-bar-wrap {
    flex: 1; height: 4px; background: #111; border-radius: 2px;
    overflow: hidden; position: relative;
  }
  .sector-mid { position: absolute; left: 50%; top: 0; width: 1px; height: 100%; background: #334; }
</style>
</head>
<body>
<div class="bg-grid"></div>

<header>
  <div class="header-inner">
    <div class="logo-area">
      <span style="font-size:22px">📊</span>
      <div>
        <div class="logo-title">SBI変動率計算ツール</div>
        <div class="logo-sub" id="logo-sub">読み込み中...</div>
      </div>
    </div>
    <div class="chips">
      <div class="chip"><span class="chip-label">入力済</span><span class="chip-val" id="chip-filled">0/0</span></div>
      <div class="chip"><span class="chip-label">カバー</span><span class="chip-val" id="chip-coverage">0.0%</span></div>
      <div class="chip"><span class="chip-label">予測</span><span class="chip-val" id="chip-pred">—</span></div>
    </div>
  </div>
</header>

<div class="tab-bar">
  <button class="tab active" onclick="switchTab('calc')">📋 銘柄入力</button>
  <button class="tab" onclick="switchTab('result')">📈 結果・検証</button>
</div>

<div class="content">
  <!-- CALC TAB -->
  <div id="tab-calc">
    <div class="preview-card">
      <div class="preview-row">
        <div class="preview-item">
          <div class="preview-label">生のΣ</div>
          <div id="sigma-raw" style="font-size:20px;font-weight:700" class="neu">—</div>
        </div>
        <div class="preview-arrow">×0.9−0.05</div>
        <div class="preview-item">
          <div class="preview-label">改良式（予測）</div>
          <div id="sigma-adj" style="font-size:30px;font-weight:700" class="neu">—</div>
        </div>
      </div>
    </div>

    <div class="filter-row">
      <input class="search-input" type="text" id="search-input" placeholder="銘柄名・コード検索" oninput="applyFilter()">
      <select id="sector-filter" onchange="applyFilter()">
        <option value="全て">全て</option>
      </select>
    </div>

    <div class="table-wrap">
      <div class="table-header">
        <span style="width:44px">コード</span>
        <span style="flex:1">銘柄</span>
        <span style="width:48px;text-align:right" onclick="handleSort('ratio')">比率 <span id="sort-ratio"></span></span>
        <span style="width:80px;text-align:right" onclick="handleSort('change')">前日比 <span id="sort-change"></span></span>
        <span style="width:64px;text-align:right" onclick="handleSort('contribution')">寄与 <span id="sort-contribution"></span></span>
      </div>
      <div class="table-body" id="table-body"></div>
    </div>
    <button class="clear-btn" onclick="clearAll()">🔄 全クリア</button>
  </div>

  <!-- RESULT TAB -->
  <div id="tab-result" class="hidden">
    <div class="card" style="text-align:center;margin:16px 0;padding:24px">
      <div class="preview-label">予測SBI変動率</div>
      <div id="result-big" style="font-size:52px;font-weight:700;letter-spacing:2px" class="neu">—</div>
      <div id="result-sub" style="font-size:10px;color:#334;margin-top:8px">—</div>
    </div>

    <div class="card">
      <div class="card-title">計算内訳</div>
      <div class="card-row"><span style="font-size:12px;color:#667">生のΣ（加重平均前日比）</span><span id="r-raw" style="font-weight:700">—</span></div>
      <div class="card-row"><span style="font-size:12px;color:#667">× 0.9 補正後</span><span id="r-09" style="font-weight:700">—</span></div>
      <div class="card-row"><span style="font-size:12px;color:#667">− 0.05% コスト控除後</span><span id="r-adj" style="font-weight:700">—</span></div>
    </div>

    <div class="card" id="top10-card">
      <div class="card-title">寄与度 TOP10</div>
      <div id="top10-list"></div>
    </div>

    <div class="card" id="sector-card">
      <div class="card-title">業種別セクター寄与</div>
      <div id="sector-list"></div>
    </div>

    <div class="card">
      <div class="card-title">実績との比較</div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <span style="font-size:12px;color:#667;flex:1">実際の変動率</span>
        <input type="number" step="0.01" id="actual-input" placeholder="例: +1.36" style="width:90px;text-align:right" oninput="calcError()">
        <span style="font-size:12px;color:#445">%</span>
      </div>
      <div id="error-section" class="hidden">
        <div class="card-row"><span style="font-size:12px;color:#667">誤差</span><span id="error-val" style="font-weight:700">—</span></div>
        <button class="save-log-btn" onclick="downloadLog()">💾 本日のログ (JSON) を保存</button>
      </div>
    </div>
  </div>
</div>

<script>
// ===== State =====
let allStocks = [];
let stocksWithChange = [];
let sortKey = "ratio";
let sortOrder = "desc";
let TOTAL_NET_ASSETS = 114987493;

// ===== Load Data =====
async function init() {
  try {
    // stocks.json 読み込み
    const res = await fetch('./stocks.json');
    const rawStocks = await res.json();
    allStocks = rawStocks.filter(s => s.evaluation > 0);
    TOTAL_NET_ASSETS = allStocks.reduce((sum, s) => sum + s.evaluation, 0) || 114987493;

    stocksWithChange = allStocks.map(s => ({
      ...s,
      ratio: (s.evaluation / TOTAL_NET_ASSETS) * 100,
      daily_change: ""
    }));

    // セクターフィルター構築
    const sectors = ["全て", ...new Set(allStocks.map(s => s.sector))];
    const sel = document.getElementById('sector-filter');
    sectors.forEach(sec => {
      const opt = document.createElement('option');
      opt.value = sec; opt.textContent = sec;
      sel.appendChild(opt);
    });

    document.getElementById('logo-sub').textContent = `全${allStocks.length}銘柄対応版 · PDF比率直接反映版`;

    // daily_changes.json 読み込み
    await loadDailyChanges();

    renderTable();
    updateHeader();
  } catch(e) {
    console.error('初期化失敗:', e);
    document.getElementById('logo-sub').textContent = 'データ読み込みエラー';
  }
}

async function loadDailyChanges() {
  try {
    const url = `./daily_changes.json?t=${Date.now()}`;
    const res = await fetch(url);
    const data = await res.json();
    stocksWithChange = stocksWithChange.map(s => ({
      ...s,
      daily_change: (typeof data[s.code] === 'number') ? String(data[s.code]) : ""
    }));
    console.log('daily_changes.json 取得成功');
  } catch(e) {
    console.log('daily_changes.json なし or 取得失敗:', e);
  }
}

// ===== Calc =====
function getSigmaRaw() {
  return stocksWithChange.reduce((sum, s) => {
    if (s.daily_change === "" || s.daily_change === null) return sum;
    const c = parseFloat(s.daily_change);
    if (isNaN(c)) return sum;
    return sum + (s.ratio * c) / 100;
  }, 0);
}

function getFilledCount() { return stocksWithChange.filter(s => s.daily_change !== "").length; }
function getCoverage() {
  return stocksWithChange.filter(s => s.daily_change !== "").reduce((sum, s) => sum + s.ratio, 0);
}

function getColor(val) {
  const n = parseFloat(val);
  if (isNaN(n) || n === 0) return "#556";
  return n > 0 ? "#00e676" : "#ff5252";
}
function fmt(val, d = 3) {
  if (isNaN(val)) return "—";
  return `${val > 0 ? "+" : ""}${val.toFixed(d)}%`;
}

// ===== Update Header =====
function updateHeader() {
  const raw = getSigmaRaw();
  const adj = raw * 0.9 - 0.05;
  const filled = getFilledCount();
  const cov = getCoverage();

  document.getElementById('chip-filled').textContent = `${filled}/${stocksWithChange.length}`;
  document.getElementById('chip-coverage').textContent = `${cov.toFixed(1)}%`;
  const predEl = document.getElementById('chip-pred');
  predEl.textContent = fmt(adj);
  predEl.style.color = getColor(adj);

  // result tab も更新
  const sigRawEl = document.getElementById('sigma-raw');
  sigRawEl.textContent = fmt(raw);
  sigRawEl.style.color = getColor(raw);
  const sigAdjEl = document.getElementById('sigma-adj');
  sigAdjEl.textContent = fmt(adj);
  sigAdjEl.style.color = getColor(adj);

  document.getElementById('result-big').textContent = fmt(adj);
  document.getElementById('result-big').style.color = getColor(adj);
  document.getElementById('result-sub').textContent =
    `Σ(${fmt(raw)}) × 0.9 − 0.05% · 入力: ${filled}/${stocksWithChange.length}銘柄 · カバー: ${cov.toFixed(1)}%`;
  document.getElementById('r-raw').textContent = fmt(raw);
  document.getElementById('r-raw').style.color = getColor(raw);
  document.getElementById('r-09').textContent = fmt(raw * 0.9);
  document.getElementById('r-09').style.color = getColor(raw * 0.9);
  document.getElementById('r-adj').textContent = fmt(adj);
  document.getElementById('r-adj').style.color = getColor(adj);

  renderTop10();
  renderSectorContribs();
}

// ===== Render Table =====
function applyFilter() { renderTable(); }

function handleSort(key) {
  if (sortKey === key) sortOrder = sortOrder === "asc" ? "desc" : "asc";
  else { sortKey = key; sortOrder = "desc"; }
  ['ratio','change','contribution'].forEach(k => {
    document.getElementById(`sort-${k}`).textContent = '';
  });
  document.getElementById(`sort-${key}`).textContent = sortOrder === 'asc' ? '↑' : '↓';
  renderTable();
}

function renderTable() {
  const search = document.getElementById('search-input').value;
  const sector = document.getElementById('sector-filter').value;

  let filtered = stocksWithChange.filter(s => {
    const mSector = sector === "全て" || s.sector === sector;
    const mSearch = !search || s.name.includes(search) || String(s.code).includes(search);
    return mSector && mSearch;
  });

  filtered.sort((a, b) => {
    let va, vb;
    if (sortKey === "ratio") { va = a.ratio; vb = b.ratio; }
    else if (sortKey === "change") { va = parseFloat(a.daily_change) || 0; vb = parseFloat(b.daily_change) || 0; }
    else {
      va = (a.ratio * (parseFloat(a.daily_change) || 0)) / 100;
      vb = (b.ratio * (parseFloat(b.daily_change) || 0)) / 100;
    }
    return sortOrder === "asc" ? va - vb : vb - va;
  });

  const tbody = document.getElementById('table-body');
  tbody.innerHTML = '';
  filtered.forEach(s => {
    const c = parseFloat(s.daily_change);
    const contrib = isNaN(c) ? 0 : (s.ratio * c) / 100;
    const color = s.daily_change === "" ? "#556" : getColor(s.daily_change);
    const contribColor = contrib === 0 ? "#445" : getColor(contrib);
    const contribStr = contrib === 0 ? "0.0000" : `${contrib > 0 ? "+" : ""}${contrib.toFixed(4)}`;

    const row = document.createElement('div');
    row.className = 'table-row';
    row.innerHTML = `
      <div style="flex:2;min-width:0;display:flex;flex-direction:column">
        <span class="stock-code">${s.code}</span>
        <div class="stock-name">${s.name}</div>
        <div class="stock-sector">${s.sector}</div>
      </div>
      <span style="width:40px;text-align:right;font-size:10px;color:#445;flex-shrink:0">${s.ratio.toFixed(2)}%</span>
      <div style="width:72px;flex-shrink:0">
        <input type="number" step="0.01" value="${s.daily_change}"
          placeholder="0.00"
          style="border-color:${s.daily_change !== '' ? color + '55' : '#222'};color:${color}"
          data-id="${s.id}" onchange="onChangeInput(this)">
      </div>
      <span style="width:64px;text-align:right;font-size:10px;font-weight:700;flex-shrink:0;color:${contribColor}">${contribStr}%</span>
    `;
    tbody.appendChild(row);
  });
}

function onChangeInput(el) {
  const id = parseInt(el.dataset.id);
  const val = el.value;
  const idx = stocksWithChange.findIndex(s => s.id === id);
  if (idx !== -1) stocksWithChange[idx].daily_change = val;
  updateHeader();
  // 該当行の寄与・色だけ更新
  const c = parseFloat(val);
  const s = stocksWithChange[idx];
  const contrib = isNaN(c) ? 0 : (s.ratio * c) / 100;
  const color = val === "" ? "#556" : getColor(val);
  el.style.color = color;
  el.style.borderColor = val !== '' ? color + '55' : '#222';
  const contribEl = el.closest('.table-row').querySelector('span:last-child');
  contribEl.style.color = contrib === 0 ? "#445" : getColor(contrib);
  contribEl.textContent = `${contrib === 0 ? "0.0000" : (contrib > 0 ? "+" : "") + contrib.toFixed(4)}%`;
}

function clearAll() {
  stocksWithChange = stocksWithChange.map(s => ({ ...s, daily_change: "" }));
  document.getElementById('actual-input').value = '';
  document.getElementById('error-section').classList.add('hidden');
  renderTable();
  updateHeader();
}

// ===== TOP10 =====
function renderTop10() {
  const contribs = stocksWithChange
    .map(s => {
      const c = parseFloat(s.daily_change);
      return { ...s, contribution: isNaN(c) ? null : (s.ratio * c) / 100 };
    })
    .filter(s => s.contribution !== null)
    .sort((a, b) => Math.abs(b.contribution) - Math.abs(a.contribution))
    .slice(0, 10);

  const el = document.getElementById('top10-list');
  el.innerHTML = '';
  contribs.forEach((s, i) => {
    const row = document.createElement('div');
    row.className = 'rank-row';
    const pct = Math.min(Math.abs(s.contribution) * 600, 100);
    const bg = s.contribution > 0
      ? 'linear-gradient(90deg,#00e676,#00b248)'
      : 'linear-gradient(90deg,#ff5252,#c50000)';
    row.innerHTML = `
      <span style="font-size:10px;color:#334;width:18px;flex-shrink:0">${i+1}</span>
      <span style="font-size:11px;color:#889;width:120px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${s.name}</span>
      <div class="rank-bar"><div class="rank-bar-fill" style="width:${pct}%;background:${bg}"></div></div>
      <span style="font-size:12px;color:${getColor(s.contribution)};width:72px;text-align:right;font-weight:700">${fmt(s.contribution,4)}</span>
    `;
    el.appendChild(row);
  });
  document.getElementById('top10-card').style.display = contribs.length ? '' : 'none';
}

// ===== Sector =====
function renderSectorContribs() {
  const counts = {};
  stocksWithChange.forEach(s => {
    const c = parseFloat(s.daily_change);
    if (isNaN(c)) return;
    const contrib = (s.ratio / 100) * (c / 100) * 100;
    counts[s.sector] = (counts[s.sector] || 0) + contrib;
  });
  const sectors = Object.entries(counts)
    .map(([name, val]) => ({ name, val }))
    .sort((a, b) => Math.abs(b.val) - Math.abs(a.val));

  const el = document.getElementById('sector-list');
  el.innerHTML = '';
  sectors.forEach(sec => {
    const row = document.createElement('div');
    row.className = 'rank-row';
    const pct = Math.min(Math.abs(sec.val) * 400, 50);
    const left = sec.val > 0 ? '50%' : `calc(50% - ${pct}%)`;
    const bg = sec.val > 0
      ? 'linear-gradient(90deg,#00e676,#00b248)'
      : 'linear-gradient(90deg,#c50000,#ff5252)';
    row.innerHTML = `
      <span style="font-size:11px;color:#889;width:90px;flex-shrink:0">${sec.name}</span>
      <div class="sector-bar-wrap">
        <div class="sector-mid"></div>
        <div style="height:100%;position:absolute;left:${left};width:${pct}%;background:${bg};transition:all 0.4s"></div>
      </div>
      <span style="font-size:12px;color:${getColor(sec.val)};width:72px;text-align:right;font-weight:700">${fmt(sec.val,4)}</span>
    `;
    el.appendChild(row);
  });
  document.getElementById('sector-card').style.display = sectors.length ? '' : 'none';
}

// ===== Error =====
function calcError() {
  const raw = getSigmaRaw();
  const adj = raw * 0.9 - 0.05;
  const actual = parseFloat(document.getElementById('actual-input').value);
  if (isNaN(actual)) {
    document.getElementById('error-section').classList.add('hidden');
    return;
  }
  const err = actual - adj;
  document.getElementById('error-section').classList.remove('hidden');
  const errEl = document.getElementById('error-val');
  errEl.textContent = fmt(err);
  errEl.style.color = Math.abs(err) < 0.2 ? '#00e676' : '#ff5252';
}

// ===== Download =====
function downloadLog() {
  const raw = getSigmaRaw();
  const adj = raw * 0.9 - 0.05;
  const actual = parseFloat(document.getElementById('actual-input').value);
  const now = new Date();
  const dateStr = now.toLocaleDateString('sv-SE');
  const timeStr = now.toLocaleTimeString('ja-JP').replace(/:/g, '-');
  const log = {
    date: dateStr,
    time: now.toLocaleTimeString('ja-JP'),
    pred: adj,
    actual: isNaN(actual) ? null : actual,
    sigmaRaw: raw,
    coverage: getCoverage(),
    filledCount: getFilledCount()
  };
  const blob = new Blob([JSON.stringify(log, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${dateStr}_${timeStr}.json`; a.click();
  URL.revokeObjectURL(url);
}

// ===== Tab Switch =====
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((el, i) => {
    el.classList.toggle('active', (i === 0 && tab === 'calc') || (i === 1 && tab === 'result'));
  });
  document.getElementById('tab-calc').classList.toggle('hidden', tab !== 'calc');
  document.getElementById('tab-result').classList.toggle('hidden', tab !== 'result');
  if (tab === 'result') { renderTop10(); renderSectorContribs(); }
}

// ===== Boot =====
init();
</script>
