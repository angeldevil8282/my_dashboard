<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBI変動率計算ツール - Pro (Sorted)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0a0e1a; color: #e0e6f0; }
        .loading { color: #00e676; display: flex; justify-content: center; align-items: center; height: 100vh; font-size: 14px; letter-spacing: 2px; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        const TOTAL_NET_ASSETS = 114987493;

        function App() {
            const [stocks, setStocks] = useState([]);
            const [loading, setLoading] = useState(true);
            const [activeTab, setActiveTab] = useState("calc");
            const [sectorFilter, setSectorFilter] = useState("全て");
            const [search, setSearch] = useState("");
            
            // ソート状態
            const [sortKey, setSortKey] = useState("ratio"); // ratio, change, contribution
            const [sortOrder, setSortOrder] = useState("desc");

            useEffect(() => {
                async function init() {
                    try {
                        const [resS, resC] = await Promise.all([
                            fetch('./stocks.json'),
                            fetch(`./daily_changes.json?t=${Date.now()}`)
                        ]);
                        const allStocksRaw = await resS.json();
                        const latestChanges = await resC.json();

                        const unique = allStocksRaw.filter((s, i, arr) =>
                            s.evaluation > 0 && arr.findIndex(x => x.id === s.id) === i
                        );

                        const mapped = unique.map(s => ({
                            ...s,
                            daily_change: (typeof latestChanges[s.code] === 'number') ? latestChanges[s.code] : ""
                        }));

                        setStocks(mapped);
                        setLoading(false);
                    } catch (e) {
                        console.error("Data Load Error:", e);
                    }
                }
                init();
            }, []);

            const sectors = useMemo(() => ["全て", ...Array.from(new Set(stocks.map(s => s.sector)))], [stocks]);
            const stocksWithRatio = useMemo(() => stocks.map(s => ({ ...s, ratio: (s.evaluation / TOTAL_NET_ASSETS) * 100 })), [stocks]);

            // 計算ロジック
            const sigmaRaw = useMemo(() => {
                return stocksWithRatio.reduce((sum, s) => {
                    const change = parseFloat(s.daily_change);
                    if (isNaN(change)) return sum;
                    return sum + (s.ratio * change) / 100;
                }, 0);
            }, [stocksWithRatio]);

            const sigmaAdjusted = sigmaRaw * 0.9 - 0.05;
            const coverageRatio = stocksWithRatio.filter(s => s.daily_change !== "").reduce((sum, s) => sum + s.ratio, 0);

            // ソートハンドラ
            const handleSort = (key) => {
                if (sortKey === key) {
                    setSortOrder(prev => (prev === "asc" ? "desc" : "asc"));
                } else {
                    setSortKey(key);
                    setSortOrder("desc");
                }
            };

            // フィルタリング & ソート実行
            const filteredStocks = useMemo(() => {
                const base = stocksWithRatio.filter(s => {
                    const matchSector = sectorFilter === "全て" || s.sector === sectorFilter;
                    const matchSearch = !search || s.name.includes(search) || s.code.includes(search);
                    return matchSector && matchSearch;
                });

                return [...base].sort((a, b) => {
                    let valA, valB;
                    if (sortKey === "ratio") {
                        [valA, valB] = [a.ratio, b.ratio];
                    } else if (sortKey === "change") {
                        [valA, valB] = [parseFloat(a.daily_change) || 0, parseFloat(b.daily_change) || 0];
                    } else if (sortKey === "contribution") {
                        valA = (a.ratio * (parseFloat(a.daily_change) || 0)) / 100;
                        valB = (b.ratio * (parseFloat(b.daily_change) || 0)) / 100;
                    }
                    return sortOrder === "asc" ? valA - valB : valB - valA;
                });
            }, [stocksWithRatio, sectorFilter, search, sortKey, sortOrder]);

            const getColor = val => {
                const n = parseFloat(val);
                if (isNaN(n) || n === 0) return "#556";
                return n > 0 ? "#00e676" : "#ff5252";
            };

            if (loading) return <div className="loading">SYSTEM INITIALIZING...</div>;

            return (
                <div style={S.root}>
                    <div style={S.bgGrid} />
                    <header style={S.header}>
                        <div style={S.headerInner}>
                            <div>
                                <div style={S.logoTitle}>SBI変動率計算ツール</div>
                                <div style={S.logoSub}>GitHub Pages Edition</div>
                            </div>
                            <div style={{ display: "flex", gap: 8 }}>
                                <Chip label="予測" val={`${sigmaAdjusted > 0 ? "+" : ""}${sigmaAdjusted.toFixed(3)}%`} color={getColor(sigmaAdjusted)} />
                            </div>
                        </div>
                    </header>

                    <div style={S.content}>
                        <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
                            <input value={search} onChange={e => setSearch(e.target.value)} placeholder="銘柄検索..." style={S.searchInput} />
                            <select value={sectorFilter} onChange={e => setSectorFilter(e.target.value)} style={S.select}>
                                {sectors.map(s => <option key={s} value={s}>{s}</option>)}
                            </select>
                        </div>

                        <div style={S.tableWrap}>
                            <div style={S.tableHeader}>
                                <span style={{ flex: 1 }}>銘柄</span>
                                <SortHeader label="比率" active={sortKey === "ratio"} order={sortOrder} onClick={() => handleSort("ratio")} width={48} />
                                <SortHeader label="前日比" active={sortKey === "change"} order={sortOrder} onClick={() => handleSort("change")} width={65} />
                                <SortHeader label="寄与" active={sortKey === "contribution"} order={sortOrder} onClick={() => handleSort("contribution")} width={60} />
                            </div>
                            
                            {filteredStocks.map(s => {
                                const change = parseFloat(s.daily_change);
                                const contrib = isNaN(change) ? 0 : (s.ratio * change) / 100;
                                return (
                                    <div key={s.id} style={S.tableRow}>
                                        <div style={{ flex: 1, minWidth: 0 }}>
                                            <div style={{ fontSize: 9, color: "#445" }}>{s.code}</div>
                                            <div style={{ fontSize: 11, color: "#aabbc0", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{s.name}</div>
                                        </div>
                                        <span style={{ width: 48, textAlign: "right", fontSize: 10, color: "#445" }}>{s.ratio.toFixed(1)}%</span>
                                        <div style={{ width: 65 }}>
                                            <input type="number" step="0.01" value={s.daily_change} 
                                                onChange={e => setStocks(prev => prev.map(item => item.id === s.id ? { ...item, daily_change: e.target.value } : item))}
                                                style={{ ...S.input, color: getColor(s.daily_change) }} placeholder="0.00" />
                                        </div>
                                        <span style={{ width: 60, textAlign: "right", fontSize: 10, fontWeight: 700, color: getColor(contrib) }}>
                                            {contrib === 0 ? "0.000" : (contrib > 0 ? "+" : "") + contrib.toFixed(3)}
                                        </span>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        // ソート用ヘッダーコンポーネント
        function SortHeader({ label, active, order, onClick, width }) {
            return (
                <div onClick={onClick} style={{ width, textAlign: "right", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "flex-end", gap: 2 }}>
                    <span style={{ color: active ? "#00e676" : "#445", fontSize: 9 }}>{label}</span>
                    <span style={{ fontSize: 8, color: active ? "#00e676" : "#222" }}>{active ? (order === "asc" ? "▲" : "▼") : "▽"}</span>
                </div>
            );
        }

        const S = {
            root: { minHeight: "100vh", background: "#0a0e1a" },
            bgGrid: { position: "fixed", inset: 0, backgroundImage: "linear-gradient(rgba(0,230,118,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,230,118,0.02) 1px,transparent 1px)", backgroundSize: "40px 40px", pointerEvents: "none" },
            header: { position: "sticky", top: 0, zIndex: 100, background: "rgba(10,14,26,0.95)", borderBottom: "1px solid #1e3a2e", backdropFilter: "blur(8px)" },
            headerInner: { maxWidth: 720, margin: "0 auto", padding: "10px 16px", display: "flex", justifyContent: "space-between", alignItems: "center" },
            logoTitle: { fontSize: 14, fontWeight: 700, color: "#00e676" },
            logoSub: { fontSize: 9, color: "#445" },
            content: { maxWidth: 720, margin: "0 auto", padding: "16px" },
            searchInput: { flex: 1, background: "#0a1520", border: "1px solid #222", borderRadius: 6, color: "#fff", padding: "8px", fontSize: 12, outline: "none" },
            select: { background: "#0a1520", border: "1px solid #222", borderRadius: 6, color: "#889", padding: "8px", fontSize: 11 },
            tableWrap: { border: "1px solid #1a2a1a", borderRadius: 8, overflow: "hidden", background: "#0d1520" },
            tableHeader: { display: "flex", alignItems: "center", padding: "8px 12px", background: "#060d18", borderBottom: "1px solid #1a2a1a", gap: 8 },
            tableRow: { display: "flex", alignItems: "center", padding: "8px 12px", borderBottom: "1px solid #0d1a0d", gap: 8 },
            input: { background: "#0a1520", border: "1px solid #222", borderRadius: 4, padding: "4px", textAlign: "right", outline: "none", width: "100%", boxSizing: "border-box", fontSize: 12 }
        };

        function Chip({ label, val, color = "#00e676" }) {
            return (
                <div style={{ background: "#060d18", border: "1px solid #1e3a2e", borderRadius: 6, padding: "4px 8px", textAlign: "center" }}>
                    <div style={{ fontSize: 8, color: "#445" }}>{label}</div>
                    <div style={{ fontSize: 11, color, fontWeight: 700 }}>{val}</div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
