<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>SBI変動率計算ツール</title>
  <style>
    body {
      background:#0a0e1a; color:#e0e6f0;
      font-family: sans-serif; margin:0;
    }
    .container { max-width:800px; margin:auto; padding:16px; }
    .card { background:#060d18; border:1px solid #1e3a2e; padding:12px; margin-bottom:12px; }
    input, select {
      background:#0a1520; color:#e0e6f0; border:1px solid #222;
      padding:4px; margin:2px;
    }
    button {
      background:#1e3a2e; color:#00e676;
      border:1px solid #00e676; padding:8px; cursor:pointer;
    }
    .pos { color:#00e676; }
    .neg { color:#ff5252; }
  </style>
</head>

<body>
<div class="container">
  <h2>📊 SBI変動率計算ツール</h2>

  <div class="card">
    <div>予測: <span id="pred">--</span></div>
    <div>カバー率: <span id="coverage">--</span></div>
  </div>

  <div class="card">
    <input id="search" placeholder="検索">
    <select id="sector"></select>
  </div>

  <div id="table"></div>

  <div class="card">
    実績: <input id="actual" type="number" step="0.01">
    <button onclick="saveLog()">ログ保存</button>
  </div>
</div>

<script>
const TOTAL_NET_ASSETS = 114987493;

let stocks = [];
let filtered = [];

async function init() {
  const stocksData = await fetch("./stocks.json").then(r => r.json());
  const changes = await fetch("./daily_changes.json?t=" + Date.now()).then(r => r.json());

  stocks = stocksData
    .filter((s,i,arr)=>s.evaluation>0 && arr.findIndex(x=>x.id===s.id)===i)
    .map(s => ({
      ...s,
      daily_change: changes[s.code] ?? ""
    }));

  setupUI();
  render();
}

function setupUI(){
  const sectors = ["全て", ...new Set(stocks.map(s=>s.sector))];
  const sel = document.getElementById("sector");
  sectors.forEach(s=>{
    const opt=document.createElement("option");
    opt.value=s; opt.textContent=s;
    sel.appendChild(opt);
  });

  document.getElementById("search").oninput = render;
  sel.onchange = render;
}

function calc(){
  let sum=0, cover=0;

  stocks.forEach(s=>{
    const ratio = s.evaluation / TOTAL_NET_ASSETS * 100;
    const c = parseFloat(s.daily_change);
    if(!isNaN(c)){
      sum += ratio*c/100;
      cover += ratio;
    }
  });

  return {
    raw: sum,
    adjusted: sum*0.9 - 0.05,
    coverage: cover
  };
}

function render(){
  const search = document.getElementById("search").value;
  const sector = document.getElementById("sector").value;

  filtered = stocks.filter(s=>{
    return (sector==="全て"||s.sector===sector) &&
           (!search || s.name.includes(search) || s.code.includes(search));
  });

  const table = document.getElementById("table");
  table.innerHTML="";

  filtered.forEach(s=>{
    const ratio = s.evaluation / TOTAL_NET_ASSETS * 100;
    const c = parseFloat(s.daily_change)||0;
    const contrib = ratio*c/100;

    const div=document.createElement("div");
    div.innerHTML = `
      ${s.code} ${s.name}
      [${ratio.toFixed(1)}%]
      <input value="${s.daily_change}" 
        onchange="update('${s.id}', this.value)">
      <span class="${contrib>=0?'pos':'neg'}">
        ${contrib.toFixed(3)}%
      </span>
    `;
    table.appendChild(div);
  });

  const res = calc();
  document.getElementById("pred").textContent =
    (res.adjusted>0?"+":"")+res.adjusted.toFixed(3)+"%";
  document.getElementById("coverage").textContent =
    res.coverage.toFixed(1)+"%";
}

function update(id,val){
  stocks = stocks.map(s=>s.id===id?{...s,daily_change:val}:s);
  render();
}

function saveLog(){
  const res = calc();
  const actual = document.getElementById("actual").value;

  const log = {
    date: new Date().toISOString(),
    pred: res.adjusted,
    actual: actual ? parseFloat(actual) : null
  };

  const blob = new Blob([JSON.stringify(log,null,2)], {type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="log.json";
  a.click();
}

init();
</script>
</body>
</html>
