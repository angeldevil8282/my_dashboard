<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📝 スポット投入</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 16px;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h2 {
            margin-top: 0;
            font-size: 1.2rem;
            border-left: 4px solid #007aff;
            padding-left: 8px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 4px;
            font-weight: bold;
        }
        .static-val {
            font-size: 1.1rem;
            font-weight: bold;
            padding: 6px 0;
        }
        input[type="number"], textarea {
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
            height: 60px;
        }
        .btn-submit {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #007aff;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
        .btn-submit:hover {
            background-color: #0056b3;
        }
        /* プレビュー領域 */
        .preview-card {
            margin-top: 24px;
            padding: 16px;
            background: #f8f9fa;
            border: 1px dashed #007aff;
            border-radius: 8px;
        }
        .preview-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 8px;
        }
        .preview-asset {
            font-size: 1.2rem;
            font-weight: bold;
            color: #111;
        }
        .preview-amount {
            font-size: 1.3rem;
            font-weight: bold;
            color: #d9534f;
            margin: 8px 0;
        }
        .preview-memo {
            font-size: 0.95rem;
            color: #444;
            background: #fff;
            padding: 6px;
            border-radius: 4px;
            border: 1px solid #eee;
            min-height: 24px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📝 スポット投入</h2>
    
    <div class="form-group">
        <label>対象</label>
        <div id="lbl-asset" class="static-val">-</div>
    </div>
    
    <div class="form-group">
        <label>下落</label>
        <div id="lbl-trigger" class="static-val">-</div>
    </div>
    
    <div class="form-group">
        <label>金額 (円)</label>
        <input type="number" id="txt-amount" value="100000" step="10000">
    </div>
    
    <div class="form-group">
        <label>メモ</label>
        <textarea id="txt-memo" placeholder="例: トランプSNS、一時的な過熱感など"></textarea>
    </div>
    
    <button class="btn-submit" id="btn-save">[記録]</button>

    <div class="preview-card">
        <div class="preview-header">
            <span id="pre-date">2026-06-05</span>
            <span id="pre-source" style="color: #007aff; font-weight: bold;">manual</span>
        </div>
        <div class="preview-asset" id="pre-asset">-</div>
        <div class="preview-amount"><span id="pre-amount">100,000</span>円 (<span id="pre-trigger">-</span>)</div>
        <div class="preview-memo" id="pre-memo"></div>
    </div>
</div>

<script>
    // 1. URLパラメータおよび日付の初期化
    const params = new URLSearchParams(window.location.search);
    const asset = params.get("asset") || "未指定の資産";
    const trigger = params.get("trigger") || "0.0%";
    const source = params.get("source") || "manual";
    
    // 日付はJS側で自動保持 (inputは出さない)
    const today = new Date().toISOString().split("T")[0];

    // 2. 画面要素の取得
    const lblAsset = document.getElementById("lbl-asset");
    const lblTrigger = document.getElementById("lbl-trigger");
    const txtAmount = document.getElementById("txt-amount");
    const txtMemo = document.getElementById("txt-memo");
    const btnSave = document.getElementById("btn-save");

    const preDate = document.getElementById("pre-date");
    const preSource = document.getElementById("pre-source");
    const preAsset = document.getElementById("pre-asset");
    const preTrigger = document.getElementById("pre-trigger");
    const preAmount = document.getElementById("pre-amount");
    const preMemo = document.getElementById("pre-memo");

    // 3. 初期値をUIに反映
    lblAsset.innerText = asset;
    lblTrigger.innerText = trigger;
    preDate.innerText = today;
    preSource.innerText = source;
    preAsset.innerText = asset;
    preTrigger.innerText = trigger;

    // 4. リアルタイムプレビューの連動
    function updatePreview() {
        const amt = parseInt(txtAmount.value) || 0;
        preAmount.innerText = amt.toLocaleString();
        preMemo.innerText = txtMemo.value || "(メモなし)";
    }

    txtAmount.addEventListener("input", updatePreview);
    txtMemo.addEventListener("input", updatePreview);
    updatePreview(); // 初回実行

    // 5. 記録ボタン押下時の処理 (フェーズ2：データ構造の確定)
    btnSave.addEventListener("click", () => {
        const payload = {
            "date": today,
            "asset": asset,
            "amount": parseInt(txtAmount.value) || 0,
            "trigger": trigger,
            "memo": txtMemo.value,
            "source": source
        };

        console.log("保存対象データ(history.json用):", payload);
        
        // フェーズ3 (NAS API) 実装用の暫定アラート
        alert(`【デバッグ】以下の内容で保存処理へ回します:\n${JSON.stringify(payload, null, 2)}`);
        
        /* // フェーズ3でここを解放
        fetch('/api/save_spot', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => alert('記録しました！'))
        .catch(err => alert('エラーが発生しました'));
        */
    });
</script>

</body>
</html>
