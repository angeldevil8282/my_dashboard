<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スポット投入</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 antialiased p-4 max-w-md mx-auto">

    <div class="bg-white rounded-xl shadow-sm p-5 mb-5 border border-gray-200">
        <h2 class="text-lg font-bold flex items-center gap-2 border-b pb-2 mb-4 text-blue-600">
            📝 スポット投入
        </h2>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-500 mb-1">投入日</label>
                <input type="date" id="txt-date" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-500 mb-1">対象</label>
                <div id="lbl-asset" class="text-xl font-bold text-gray-900">--</div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-500 mb-1">下落率</label>
                <div id="lbl-trigger" class="text-lg font-bold text-red-500">--</div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-500 mb-1">金額 (円)</label>
                <input type="number" id="txt-amount" value="10000" step="1000" class="w-full p-2.5 border rounded-lg font-mono text-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-500 mb-1">メモ</label>
                <textarea id="txt-memo" rows="2" placeholder="メモを残せます" class="w-full p-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
            </div>

            <button id="btn-save" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-3 rounded-lg transition shadow-sm active:scale-[0.98]">
                [記録する]
            </button>
        </div>
    </div>

    <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 mb-5">
        <div class="flex justify-between items-center text-xs text-blue-500 font-bold mb-1">
            <span id="pre-date">----(--(--)</span>
            <span id="pre-source" class="bg-blue-200 px-2 py-0.5 rounded text-blue-700 font-mono">manual</span>
        </div>
        <div id="pre-asset" class="font-bold text-gray-900">--</div>
        <div class="text-xl font-extrabold text-red-600 my-1">
            <span id="pre-amount">0</span>円 <span class="text-sm font-normal" id="pre-trigger">(--)</span>
        </div>
        <div id="pre-memo" class="text-xs text-gray-500 italic mt-1"></div>
    </div>

    <div class="bg-gradient-to-br from-gray-800 to-gray-900 text-white rounded-xl p-4 mb-5 shadow-sm">
        <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">
            📊 統計情報 (<span id="stats-asset-name">--</span>)
        </h3>
        <div class="grid grid-cols-3 gap-2 text-center">
            <div class="bg-gray-700/50 p-2 rounded-lg">
                <div class="text-xs text-gray-400">投入回数</div>
                <div class="text-lg font-bold text-blue-400" id="stat-count">0回</div>
            </div>
            <div class="bg-gray-700/50 p-2 rounded-lg">
                <div class="text-xs text-gray-400">累計投入</div>
                <div class="text-lg font-bold text-emerald-400" id="stat-total">0円</div>
            </div>
            <div class="bg-gray-700/50 p-2 rounded-lg">
                <div class="text-xs text-gray-400">平均投入</div>
                <div class="text-lg font-bold text-orange-400" id="stat-avg">0円</div>
            </div>
        </div>
    </div>

    <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-200">
        <h3 class="text-sm font-bold text-gray-500 mb-3 flex items-center justify-between">
            <span>📜 過去のスポット投入履歴</span>
            <span class="text-xs font-normal text-gray-400">※該当資産のみ抽出</span>
        </h3>
        <div id="history-list" class="space-y-3">
            </div>
    </div>

    <script>
        // 1. 擬似的な history.json データ（複数資産が混在する汎用構造）
        const mockHistoryData = [
            { "date": "2026-06-06", "asset": "日経平均", "amount": 7000, "trigger": "-1.31%", "source": "crash_jp", "memo": "" },
            { "date": "2026-05-20", "asset": "日経平均", "amount": 10000, "trigger": "-4.20%", "source": "crash_jp", "memo": "" },
            { "date": "2026-05-15", "asset": "SBI日本高配当", "amount": 5000, "trigger": "-0.85%", "source": "sbi", "memo": "分配金再投資タイミング" },
            { "date": "2026-04-10", "asset": "QQQ", "amount": 15000, "trigger": "-3.10%", "source": "nasdaq_alert", "memo": "調整局面" }
        ];

        // 2. 標準的なURLSearchParamsのみでパース（トリッキーな置換は全削除）
        const params = new URLSearchParams(window.location.search);
        const asset = params.get("asset") || "日経平均"; // テスト用にデフォルト値を設定
        const trigger = params.get("trigger") || "0.0%";
        const source = params.get("source") || "manual";
        
        // 当日の日付初期設定
        const today = new Date().toISOString().split("T")[0];
        const txtDate = document.getElementById("txt-date");
        if (txtDate) txtDate.value = today;

        // UI要素の取得
        const lblAsset = document.getElementById("lbl-asset");
        const lblTrigger = document.getElementById("lbl-trigger");
        const txtAmount = document.getElementById("txt-amount");
        const txtMemo = document.getElementById("txt-memo");
        const btnSave = document.getElementById("btn-save");

        const preDate = document.getElementById("pre-date");
        const preSource = document.getElementById("pre-source");
        const preAsset = document.getElementById("pre-asset");
        const preTrigger = document.getElementById("pre-trigger");
        const preAmount = document.getElementById("pre-amount");
        const preMemo = document.getElementById("pre-memo");

        // 初期パラメータをフォームに反映
        if (lblAsset) lblAsset.innerText = asset;
        if (lblTrigger) lblTrigger.innerText = trigger;
        if (preDate) preDate.innerText = today;
        if (preAsset) preAsset.innerText = asset;
        if (preTrigger) preTrigger.innerText = trigger;
        if (preSource) {
            preSource.innerText = source;
            preSource.className = source !== 'manual' 
                ? "bg-amber-100 px-2 py-0.5 rounded text-amber-700 font-mono text-xs"
                : "bg-gray-200 px-2 py-0.5 rounded text-gray-600 font-mono text-xs";
        }

        // 3. データ駆動で統計と履歴リストをレンダリングする関数
        function renderDashboard(history, targetAsset) {
            // 指定された資産のデータのみにフィルタリング
            const filtered = history.filter(item => item.asset === targetAsset);
            
            // 統計の計算
            const count = filtered.length;
            const total = filtered.reduce((sum, item) => sum + item.amount, 0);
            const avg = count > 0 ? Math.round(total / count) : 0;

            // 統計UIの更新
            document.getElementById("stats-asset-name").innerText = targetAsset;
            document.getElementById("stat-count").innerText = `${count}回`;
            document.getElementById("stat-total").innerText = `${total.toLocaleString()}円`;
            document.getElementById("stat-avg").innerText = `${avg.toLocaleString()}円`;

            // 履歴リストUIの動的生成
            const listContainer = document.getElementById("history-list");
            listContainer.innerHTML = ""; // 初期化

            if (filtered.length === 0) {
                listContainer.innerHTML = `<div class="text-xs text-gray-400 text-center py-4">過去の投入履歴はありません</div>`;
                return;
            }

            filtered.forEach(item => {
                const itemHtml = `
                    <div class="flex justify-between items-center pb-2.5 border-b border-gray-100 last:border-none">
                        <div>
                            <div class="text-xs text-gray-400 font-mono">${item.date}</div>
                            <div class="text-sm font-bold text-gray-800">${item.asset}</div>
                            ${item.memo ? `<div class="text-[11px] text-gray-400 italic">${item.memo}</div>` : ''}
                        </div>
                        <div class="text-right">
                            <div class="text-sm font-bold text-gray-900">${item.amount.toLocaleString()}円</div>
                            <div class="text-xs text-red-500 font-semibold">${item.trigger}</div>
                        </div>
                    </div>
                `;
                listContainer.insertAdjacentHTML('beforeend', itemHtml);
            });
        }

        // リアルタイムプレビュー連動
        function updatePreview() {
            const amt = parseInt(txtAmount.value) || 0;
            if (preAmount) preAmount.innerText = amt.toLocaleString();
            if (preMemo) preMemo.innerText = txtMemo.value || "(メモなし)";
            if (preDate && txtDate) preDate.innerText = txtDate.value;
        }

        if (txtDate) txtDate.addEventListener("change", updatePreview);
        if (txtAmount) txtAmount.addEventListener("input", updatePreview);
        if (txtMemo) txtMemo.addEventListener("input", updatePreview);

        // 初回実行: プレビュー更新 ＆ 統計・履歴の描画
        updatePreview();
        renderDashboard(mockHistoryData, asset);

        // 記録ボタン処理
        if (btnSave) {
            btnSave.addEventListener("click", () => {
                const payload = {
                    "date": txtDate ? txtDate.value : today,
                    "asset": asset,
                    "amount": parseInt(txtAmount.value) || 0,
                    "trigger": trigger, // 文字列のまま保存 ("-1.31%")
                    "memo": txtMemo.value,
                    "source": source
                };
                alert(`【デバッグ】APIへ送信するペイロード:\n${JSON.stringify(payload, null, 2)}`);
            });
        }
    </script>
</body>
</html>
