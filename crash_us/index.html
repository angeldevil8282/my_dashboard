<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>米国株 暴落監視</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; }
        .card { background-color: #161b22; border: 1px solid #30363d; }
        .status-down { color: #ff7b72; }
        .status-up { color: #3fb950; }
        .target-reached { background-color: rgba(63, 185, 80, 0.15); border-color: #3fb950; }
        .spot-hint { background-color: rgba(56, 139, 253, 0.15); border: 1px dashed #388bfd; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <header class="mb-8 flex justify-between items-end">
            <div>
                <h1 class="text-2xl font-bold text-white">米国株 暴落監視</h1>
                <p id="last-update" class="text-sm text-gray-500">Loading...</p>
            </div>
            <div class="text-right">
                <span class="text-xs bg-gray-800 px-2 py-1 rounded">Auto Update</span>
            </div>
        </header>

        <div id="stock-list" class="grid gap-4 md:grid-cols-2">
            </div>

        <div class="mt-12">
            <h2 class="text-lg font-bold text-white mb-4 flex items-center">
                <span class="mr-2">📝</span> 米国株スポット購入ルール
            </h2>
            <div class="card p-4 rounded-lg overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead class="text-xs text-gray-500 border-b border-gray-800">
                        <tr>
                            <th class="pb-2">米国株騰落率</th>
                            <th class="pb-2">購入額 (目安)</th>
                        </tr>
     script               </thead>
                    <tbody class="text-gray-300">
                        <tr class="border-b border-gray-800/50"><td class="py-2">FANG / QQQ 40% 下落(高値比)</td><td class="py-2">11万円 (or 1株) × 12銘柄</td></tr>
                        <tr class="border-b border-gray-800/50"><td class="py-2">FANG / QQQ 55% 下落(高値比)</td><td class="py-2">11万円 (or 1株) × 12銘柄</td></tr>
                        <tr class="border-b border-gray-800/50"><td class="py-2">FANG / QQQ 65% 下落(高値比)</td><td class="py-2">さらに追加購入検討</td></tr>
                        <tr><td class="py-2">その他 メガテック急落時</td><td class="py-2">個別判断で購入</td></tr>
                    </tbody>
            </div>
        </div>

        <footer class="mt-12 text-center text-xs text-gray-600">
            &copy; 2026 Asset Logic / Powered by yfinance
        </footer>
    </div>

    <script>
        // 米国株用スポット購入ロジック (QQQを基準に設定)
        function getSpotAdvice(symbol, changePct) {
            const pct = Math.abs(changePct);
            if (changePct >= 0) return null;
            
            // QQQまたは主要メガテックの場合のみアドバイス表示
            if (symbol === 'QQQ' || ['MSFT', 'NVDA', 'AAPL'].includes(symbol)) {
                if (pct >= 5.0) return { days: "緊急", amount: "要検討" }; // 5%以上は異常事態
                if (pct >= 3.0) return { days: 80, amount: 69600 };
                if (pct >= 2.5) return { days: 50, amount: 43500 };
                if (pct >= 2.0) return { days: 30, amount: 26100 };
                return null;
            }
            return null;
        }
    
        // fetchMarketData内のカード生成部分の通貨表示を「$」に変更
        // (s.current_price.toLocaleString() + '円' → '$' + s.current_price)
        // アドバイス取得関数の呼び出し引数に symbol を追加
        const advice = getSpotAdvice(s.symbol, s.change_pct);

        async function fetchMarketData() {
            try {
                const response = await fetch('./data/daily_changes.json?' + new Date().getTime());
                const data = await response.json();
                
                document.getElementById('last-update').innerText = `最終更新: ${data.date}`;
                
                const container = document.getElementById('stock-list');
                container.innerHTML = '';

                data.stocks.forEach(s => {
                    const isReached = s.diff_to_target <= 0;
                    const colorClass = s.change_pct < 0 ? 'status-down' : 'status-up';
                    const mark = s.change_pct < 0 ? '▼' : '▲';
                    
                    // 米国株の場合のみアドバイスを取得
                    const advice = (s.symbol === '^N225' || s.name.includes('日経')) ? getSpotAdvice(s.change_pct) : null;
                    
                    const card = document.createElement('div');
                    card.className = `card p-4 rounded-lg ${isReached ? 'target-reached' : ''} flex flex-col justify-between`;
                    
                    card.innerHTML = `
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <div>
                                    <h3 class="font-bold text-lg text-white">${s.name}</h3>
                                    <p class="text-xs text-gray-500">${s.symbol}</p>
                                </div>
                                <div class="text-right">
                                    <span class="text-2xl font-mono ${colorClass}">${mark}${Math.abs(s.change_pct)}%</span>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-2 mt-4 text-sm">
                                <div>
                                    <p class="text-gray-500 text-xs">現在価格</p>
                                    <p class="font-bold text-white">${s.current_price.toLocaleString()}円</p>
                                </div>
                                <div class="text-right">
                                    <p class="text-gray-500 text-xs">目標価格</p>
                                    <p class="text-white">${s.reference_price.toLocaleString()}円</p>
                                </div>
                            </div>
                        </div>

                        <div>
                            ${advice ? `
                            <div class="mt-4 p-2 rounded spot-hint text-center">
                                <p class="text-[10px] text-blue-300 uppercase font-bold">推奨スポット追加</p>
                                <p class="text-lg font-bold text-white">${advice.amount.toLocaleString()}円 <span class="text-xs font-normal">(${advice.days}日分)</span></p>
                            </div>
                            ` : ''}

                            <div class="mt-3 pt-3 border-t border-gray-800 flex justify-between items-center">
                                <span class="text-xs ${isReached ? 'text-green-400 font-bold' : 'text-gray-500'}">
                                    ${isReached ? '🎯 目標到達' : `あと +${s.diff_to_target.toLocaleString()}円`}
                                </span>
                                <span class="text-[10px] px-2 py-0.5 rounded bg-gray-800 text-gray-400">
                                    通知閾値: ${s.target_down}%
                                </span>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                console.error("データの読み込みに失敗しました", e);
            }
        }

        fetchMarketData();
        setInterval(fetchMarketData, 300000);
    </script>
</body>
</html>
