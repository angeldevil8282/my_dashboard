<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>米国株 暴落監視</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; }
        .card { background-color: #161b22; border: 1px solid #30363d; }
        .status-down { color: #ff7b72; }
        .status-up { color: #3fb950; }
        .target-reached { background-color: rgba(63, 185, 80, 0.15); border-color: #3fb950; }
        .spot-hint { background-color: rgba(56, 139, 253, 0.15); border: 1px dashed #388bfd; }
        .back-link:hover { color: #58a6ff; text-decoration: underline; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <nav class="mb-4">
            <a href="https://angeldevil8282.github.io/my_dashboard/index.html" class="back-link text-sm text-gray-500 flex items-center">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                メインダッシュボードに戻る
            </a>
        </nav>

        <header class="mb-8 flex justify-between items-end">
            <div>
                <h1 class="text-2xl font-bold text-white">🇺🇸 米国株 暴落監視</h1>
                <p id="last-update" class="text-sm text-gray-500">Loading...</p>
            </div>
            <div class="text-right text-xs bg-gray-800 px-2 py-1 rounded">
                Auto Update
            </div>
        </header>

        <div id="stock-list" class="grid gap-4 md:grid-cols-2"></div>

        <div class="mt-12">
            <h2 class="text-lg font-bold text-white mb-4 flex items-center">
                <span class="mr-2">📉</span> 米国株 階段買い（大暴落用）
            </h2>
            <div class="card p-4 rounded-lg overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead class="text-xs text-gray-500 border-b border-gray-800">
                        <tr>
                            <th class="pb-2">下落率 (高値比)</th>
                            <th class="pb-2">ターゲット指標</th>
                            <th class="pb-2">購入アクション (目安)</th>
                        </tr>
                    </thead>
                    <tbody class="text-gray-300 font-mono text-xs">
                        <tr class="border-b border-gray-800/50">
                            <td class="py-2 text-white font-bold">- 40%</td>
                            <td class="py-2 italic text-gray-400 text-[10px]">NASDAQ100トレンド/FANG</td>
                            <td class="py-2 text-blue-300 font-bold text-sm">10万円 (or 1株) × 9銘柄</td>
                        </tr>
                        <tr class="border-b border-gray-800/50">
                            <td class="py-2 text-white font-bold">- 55%</td>
                            <td class="py-2 italic text-gray-400 text-[10px]">NASDAQ100トレンド/FANG</td>
                            <td class="py-2 text-blue-300 font-bold text-sm">10万円 (or 1株) × 9銘柄</td>
                        </tr>
                        <tr class="border-b border-gray-800/50">
                            <td class="py-2 text-white font-bold">- 65%</td>
                            <td class="py-2 italic text-gray-400 text-[10px]">NASDAQ100トレンド/FANG</td>
                            <td class="py-2 text-blue-300 font-bold text-sm">10万円 (or 1株) × 9銘柄</td>
                        </tr>
                        <tr>
                            <td class="py-2" colspan="2">主要メガテック急落時</td>
                            <td class="py-2 italic text-gray-400">適宜スポット購入を検討</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <footer class="mt-12 text-center text-xs text-gray-600 border-t border-gray-800 pt-4">
            &copy; 2026 Asset Logic / Powered by yfinance
        </footer>
    </div>

    <script>
        // スポット購入アドバイス（米国株用）
        function getSpotAdvice(symbol, changePct) {
            const pct = Math.abs(changePct);
            if (changePct >= 0) return null;
            
            // 対象銘柄リスト
            const targets = ['QQQ', 'MSFT', 'NVDA', 'AAPL', 'AVGO', 'TSM', 'GOOGL', 'META', 'AMZN', 'MU', 'PLTR'];
            
            if (targets.includes(symbol)) {
                if (pct >= 5.0) return { label: "緊急事態", note: "個別判断で追加" };
                if (pct >= 3.0) return { label: "10万円 (or 1株)", note: "強い調整" };
                if (pct >= 2.0) return { label: "少額検討", note: "押し目買い" };
            }
            return null;
        }

        async function fetchMarketData() {
            try {
                const response = await fetch('./data/daily_changes.json?' + new Date().getTime());
                const data = await response.json();
                
                document.getElementById('last-update').innerText = `最終更新: ${data.date}`;
                
                const container = document.getElementById('stock-list');
                container.innerHTML = '';

                data.stocks.forEach(s => {
                    const isReached = s.diff_to_target <= 0;
                    const colorClass = s.change_pct < 0 ? 'status-down' : 'status-up';
                    const mark = s.change_pct < 0 ? '▼' : '▲';
                    
                    const isUS = !(s.symbol === '^N225' || s.name.includes('日経'));
                    const currencySign = isUS ? '$' : '¥';
                    
                    const advice = getSpotAdvice(s.symbol, s.change_pct);
                    
                    const card = document.createElement('div');
                    card.className = `card p-4 rounded-lg ${isReached ? 'target-reached' : ''} flex flex-col justify-between`;
                    
                    card.innerHTML = `
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <div>
                                    <h3 class="font-bold text-lg text-white">${s.name}</h3>
                                    <p class="text-xs text-gray-500 font-mono">${s.symbol}</p>
                                </div>
                                <div class="text-right">
                                    <span class="text-2xl font-mono ${colorClass}">${mark}${Math.abs(s.change_pct)}%</span>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-2 mt-4 text-sm font-mono">
                                <div>
                                    <p class="text-gray-500 text-[10px] uppercase font-bold">Current</p>
                                    <p class="font-bold text-white">${currencySign}${s.current_price.toLocaleString()}</p>
                                </div>
                                <div class="text-right">
                                    <p class="text-gray-500 text-[10px] uppercase font-bold">Target</p>
                                    <p class="text-white">${currencySign}${s.reference_price.toLocaleString()}</p>
                                </div>
                            </div>
                        </div>

                        <div>
                            ${advice ? `
                            <div class="mt-4 p-2 rounded spot-hint text-center">
                                <p class="text-[10px]
