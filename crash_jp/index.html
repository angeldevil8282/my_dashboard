<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本株 暴落監視</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; }
        .card { background-color: #161b22; border: 1px solid #30363d; }
        .status-down { color: #ff7b72; }
        .status-up { color: #3fb950; }
        .target-reached { background-color: rgba(63, 185, 80, 0.15); border-color: #3fb950; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <header class="mb-8 flex justify-between items-end">
            <div>
                <h1 class="text-2xl font-bold text-white">日本株 暴落監視</h1>
                <p id="last-update" class="text-sm text-gray-500">Loading...</p>
            </div>
            <div class="text-right">
                <span class="text-xs bg-gray-800 px-2 py-1 rounded">Auto Update</span>
            </div>
        </header>

        <div id="stock-list" class="grid gap-4 md:grid-cols-2">
            </div>

        <footer class="mt-12 text-center text-xs text-gray-600">
            &copy; 2026 Asset Logic / Powered by yfinance
        </footer>
    </div>

    <script>
        async function fetchMarketData() {
            try {
                const response = await fetch('./data/daily_changes.json?' + new Date().getTime());
                const data = await response.json();
                
                document.getElementById('last-update').innerText = `最終更新: ${data.date}`;
                
                const container = document.getElementById('stock-list');
                container.innerHTML = '';

                data.stocks.forEach(s => {
                    const isReached = s.diff_to_target <= 0;
                    const colorClass = s.change_pct < 0 ? 'status-down' : 'status-up';
                    const mark = s.change_pct < 0 ? '▼' : '▲';
                    
                    const card = document.createElement('div');
                    card.className = `card p-4 rounded-lg ${isReached ? 'target-reached' : ''}`;
                    
                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <h3 class="font-bold text-lg text-white">${s.name}</h3>
                                <p class="text-xs text-gray-500">${s.symbol}</p>
                            </div>
                            <div class="text-right">
                                <span class="text-2xl font-mono ${colorClass}">${mark}${Math.abs(s.change_pct)}%</span>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-2 mt-4 text-sm">
                            <div>
                                <p class="text-gray-500 text-xs">現在価格</p>
                                <p class="font-bold text-white">${s.current_price.toLocaleString()}円</p>
                            </div>
                            <div class="text-right">
                                <p class="text-gray-500 text-xs">目標価格</p>
                                <p class="text-white">${s.reference_price.toLocaleString()}円</p>
                            </div>
                        </div>
                        <div class="mt-3 pt-3 border-t border-gray-800 flex justify-between items-center">
                            <span class="text-xs ${isReached ? 'text-green-400 font-bold' : 'text-gray-500'}">
                                ${isReached ? '🎯 目標到達' : `あと +${s.diff_to_target.toLocaleString()}円`}
                            </span>
                            <span class="text-[10px] px-2 py-0.5 rounded bg-gray-800 text-gray-400">
                                閾値: ${s.target_down}%
                            </span>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                console.error("データの読み込みに失敗しました", e);
            }
        }

        fetchMarketData();
        // 5分おきに画面を自動リロード
        setInterval(fetchMarketData, 300000);
    </script>
</body>
</html>
