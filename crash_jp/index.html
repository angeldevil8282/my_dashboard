<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本株 暴落監視</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; }
        .card { background-color: #161b22; border: 1px solid #30363d; }
        .status-down { color: #ff7b72; }
        .status-up { color: #3fb950; }
        /* 米国株に合わせた地味な赤枠・赤背景に修正 */
        .target-reached { background-color: rgba(110,118,129,0.08); border-color: #3fb950; }
        .spot-hint { background-color: rgba(56, 139, 253, 0.15); border: 1px dashed #388bfd; }
        /* 戻るリンクのスタイル追加 */
        .back-link:hover { color: #58a6ff; text-decoration: underline; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <nav class="mb-4">
            <a href="https://angeldevil8282.github.io/my_dashboard/index.html" class="back-link text-sm text-gray-500 flex items-center font-sans">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                メインダッシュボードに戻る
            </a>
        </nav>

        <header class="mb-8 flex justify-between items-end">
            <div>
                <h1 class="text-2xl font-bold text-white font-sans">🇯🇵 日本株 暴落監視</h1>
                <p id="last-update" class="text-sm text-gray-500">Loading...</p>
            </div>
            <div class="text-right">
                <span class="text-xs bg-gray-800 px-2 py-1 rounded">Auto Update</span>
            </div>
        </header>

        <div id="stock-list" class="grid gap-4 md:grid-cols-2"></div>

        <div class="mt-12 font-sans">
            <h2 class="text-lg font-bold text-white mb-4 flex items-center">
                <span class="mr-2">📝</span> 日経平均スポット購入ルール
            </h2>
            <div class="card p-4 rounded-lg overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead class="text-xs text-gray-500 border-b border-gray-800">
                        <tr>
                            <th class="pb-2">日経平均騰落率</th>
                            <th class="pb-2">積立日数</th>
                            <th class="pb-2">購入額 (目安)</th>
                        </tr>
                    </thead>
                    <tbody class="text-gray-300 font-mono">
                        <tr class="border-b border-gray-800/50"><td class="py-2">-0.5% 以上</td><td class="py-2">5日分</td><td class="py-2">4,350円</td></tr>
                        <tr class="border-b border-gray-800/50"><td class="py-2">-1.0% 以上</td><td class="py-2">8日分</td><td class="py-2">6,960円</td></tr>
                        <tr class="border-b border-gray-800/50"><td class="py-2">-1.5% 以上</td><td class="py-2">15日分</td><td class="py-2">13,050円</td></tr>
                        <tr class="border-b border-gray-800/50"><td class="py-2">-2.0% 以上</td><td class="py-2">30日分</td><td class="py-2">26,100円</td></tr>
                        <tr class="border-b border-gray-800/50"><td class="py-2">-2.5% 以上</td><td class="py-2">50日分</td><td class="py-2">43,500円</td></tr>
                        <tr><td class="py-2">-3.0% 以上</td><td class="py-2">80日分</td><td class="py-2">69,600円</td></tr>
                    </tbody>
                </table>
                <p class="mt-3 text-[10px] text-gray-500 italic">※連日下落時は一段下のランクを採用。日給換算ベース(870円/日)</p>
            </div>
        </div>

        <footer class="mt-12 text-center text-xs text-gray-600 border-t border-gray-800 pt-4 font-sans">
            &copy; 2026 Asset Logic / Powered by yfinance
        </footer>
    </div>

    <script>
        // スポット購入ロジック
        function getSpotAdvice(changePct) {
            const pct = Math.abs(changePct);
            if (changePct >= 0) return null;
            if (pct >= 3.0) return { days: 80, amount: 69600 };
            if (pct >= 2.5) return { days: 50, amount: 43500 };
            if (pct >= 2.0) return { days: 30, amount: 26100 };
            if (pct >= 1.5) return { days: 15, amount: 13050 };
            if (pct >= 1.0) return { days: 8, amount: 6960 };
            if (pct >= 0.5) return { days: 5, amount: 4350 };
            return null;
        }

        async function fetchMarketData() {
            try {
                const response = await fetch('./data/daily_changes.json?' + new Date().getTime());
                const data = await response.json();
                
                document.getElementById('last-update').innerText = `最終更新: ${data.date}`;
                
                const container = document.getElementById('stock-list');
                container.innerHTML = '';

                data.stocks.forEach(s => {
                    const isReached = s.diff_to_target <= 0;
                    const colorClass = s.change_pct < 0 ? 'status-down' : 'status-up';
                    const mark = s.change_pct < 0 ? '▼' : '▲';
                    
                    const advice = (s.symbol === '^N225' || s.name.includes('日経')) ? getSpotAdvice(s.change_pct) : null;
                    
                    const card = document.createElement('div');
                    card.className = `card p-4 rounded-lg ${isReached ? 'target-reached' : ''} flex flex-col justify-between`;
                    
                    card.innerHTML = `
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <div>
                                    <h3 class="font-bold text-lg text-white font-sans">${s.name}</h3>
                                    <p class="text-xs text-gray-500 font-mono">${s.symbol}</p>
                                </div>
                                <div class="text-right">
                                    <span class="text-2xl font-mono ${colorClass}">${mark}${Math.abs(s.change_pct).toFixed(2)}%</span>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-2 mt-4 text-sm font-mono">
                                <div>
                                    <p class="text-gray-500 text-[10px] uppercase font-bold font-sans">Current</p>
                                    <p class="font-bold text-white">${s.current_price.toLocaleString()}円</p>
                                </div>
                                <div class="text-right">
                                    <span class="text-gray-500 text-[10px] uppercase font-bold font-sans">Target</span>
                                    <p class="text-white">${s.reference_price.toLocaleString()}円</p>
                                </div>
                            </div>
                        </div>

                        <div>
                            ${advice ? `
                            <div class="mt-4 p-2 rounded spot-hint text-center font-sans">
                                <p class="text-[10px] text-blue-300 uppercase font-bold">推奨スポット追加</p>
                                <p class="text-lg font-bold text-white">${advice.amount.toLocaleString()}円 <span class="text-xs font-normal">(${advice.days}日分)</span></p>
                            </div>
                            ` : ''}

                            <div class="mt-3 pt-3 border-t border-gray-800 flex justify-between items-center font-sans">
                                <span class="text-xs font-mono ${isReached ? 'text-red-400 font-bold' : 'text-gray-500'}">
                                    ${isReached ? '🚨 目標到達' : `あと +${s.diff_to_target.toLocaleString()}円`}
                                </span>
                                <span class="text-[10px] px-2 py-0.5 rounded bg-gray-800 text-gray-400">
                                    通知閾値: ${s.target_down}%
                                </span>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                console.error("データの読み込みに失敗しました", e);
                document.getElementById('last-update').innerText = "データ読み込みエラー";
            }
        }

        fetchMarketData();
        setInterval(fetchMarketData, 300000);
    </script>
</body>
</html>
